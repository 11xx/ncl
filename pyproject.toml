[project]
name = "ncl"
version = "0.1.0"
description = "Programmatic Nextcloud access for AI coding harnesses: calendars and files from a CLI."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ncl = "ncl.cli:main"

# `uv run pytest` and `uv run ruff check .` are the gates. Naming them here
# keeps the command that verifies a change the same for everyone who runs it.
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16"]

# Stated here rather than inherited, so the gate reports the same findings on
# every host instead of whatever the person running it configured globally.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PYI", "RUF", "PLE", "PLW"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ncl"]
