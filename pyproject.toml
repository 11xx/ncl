[project]
name = "ncl"
version = "2026.08.17"
description = "Programmatic Nextcloud access for AI agents: a CLI covering calendars and tasks today, and further Nextcloud apps as they are added."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["icalendar>=6", "python-dateutil>=2.9"]
keywords = ["nextcloud", "caldav", "carddav", "webdav", "cli", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications",
    "Topic :: Office/Business :: Scheduling",
]

[project.scripts]
ncl = "ncl.cli:main"

# `uv run pytest` and `uv run ruff check .` are the gates. Naming them here
# keeps the command that verifies a change the same for everyone who runs it.
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16"]

# Stated here rather than inherited, so the gate reports the same findings on
# every host instead of whatever the person running it configured globally.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PYI", "RUF", "PLE", "PLW"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ncl"]
